services:
  greenroom:
    image: ghcr.io/markbrutx/greenroom:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GREENROOM_PASSWORD_HASH: ${GREENROOM_PASSWORD_HASH:?set it}
      GREENROOM_SECRET: ${GREENROOM_SECRET:?set it}
      GREENROOM_NAME: ${GREENROOM_NAME:-Greenroom}
      GREENROOM_TZ: ${GREENROOM_TZ:-UTC}
    volumes:
      - greenroom-data:/data

volumes:
  greenroom-data:
