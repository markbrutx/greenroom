services:
  moored:
    image: ghcr.io/markbrutx/moored:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MOORED_TRUSTED_PROXIES: ${MOORED_TRUSTED_PROXIES:-172.16.0.0/12}
      MOORED_NAME: ${MOORED_NAME:-moored.dev}
      MOORED_TZ: ${MOORED_TZ:-UTC}
      MOORED_ROOM_TTL: ${MOORED_ROOM_TTL:-168h}
    volumes:
      - moored-data:/data

volumes:
  moored-data:
