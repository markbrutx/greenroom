apiVersion: apps/v1
kind: Deployment
metadata:
  name: moored
  labels:
    app.kubernetes.io/name: moored
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moored
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moored
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: moored
          image: ghcr.io/markbrutx/moored:0.4.0
          args: ["serve"]
          env:
            - name: MOORED_DATABASE_URL
              value: sqlite:/data/moored.db
            - name: MOORED_ADDR
              value: ":8080"
            - name: MOORED_ROOM_TTL
              value: 168h
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: moored-data
