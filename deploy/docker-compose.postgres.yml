services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it}
      POSTGRES_DB: greenroom
    volumes:
      - greenroom-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenroom -d greenroom"]
      interval: 5s
      timeout: 5s
      retries: 10

  greenroom:
    image: ghcr.io/markbrutx/greenroom:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GREENROOM_DATABASE_URL: postgres://greenroom:${POSTGRES_PASSWORD}@db:5432/greenroom?sslmode=disable
      GREENROOM_PASSWORD: ${GREENROOM_PASSWORD:?set it}
      GREENROOM_TRUSTED_PROXIES: ${GREENROOM_TRUSTED_PROXIES:-172.16.0.0/12}
      GREENROOM_NAME: ${GREENROOM_NAME:-Greenroom}
      GREENROOM_TZ: ${GREENROOM_TZ:-UTC}

volumes:
  greenroom-pg:
