{{define "head"}}<link rel="stylesheet" href="{{asset "retro/retro.css"}}"><script src="{{asset "retro/retro.js"}}" defer></script>{{end}}
{{define "bar"}}<div class="here" id="here" aria-label="Here now"></div>
<button class="btn btn-sm" type="button" id="copy">Copy summary</button>{{end}}
{{define "main"}}
<script type="application/json" id="retro-state">{{.Data}}</script>
<h2 class="block-head">Warm-up</h2>
<div class="warmup"><textarea id="warmup" rows="1" maxlength="300" aria-label="Warm-up question"></textarea><button class="icon-btn" type="button" id="warmup-dice" title="Another question" aria-label="Another question">{{icon "dice"}}</button></div>
<div class="col col-w" id="col-w"><div class="cards"></div><button class="add" type="button" data-add="w">+ Answer</button></div>
<div id="carry-block" hidden><h2 class="block-head">From last time</h2><ul class="carry" id="carry" role="list"></ul></div>
<h2 class="block-head">Board <button class="icon-btn" type="button" id="cols-dice" title="Another column set, while the columns are empty" aria-label="Another column set">{{icon "dice"}}</button></h2>
<div class="board" id="board">
<div class="col col-a" id="col-a"><h3 class="col-title">Actions</h3><div class="cards"></div><button class="add" type="button" data-add="a">+ Action</button></div>
</div>
<div class="picker" id="picker" role="menu" aria-label="Add a reaction" hidden></div>
<template id="tpl-col"><div class="col"><input class="col-title" maxlength="80" aria-label="Column title" autocomplete="off"><div class="cards"></div><button class="add" type="button">+ Card</button></div></template>
<template id="tpl-card"><article class="rcard"><textarea rows="1" maxlength="2000" aria-label="Card text"></textarea><div class="reacts" hidden></div><div class="rcard-foot"><span class="who"></span><span class="lockmsg"></span><span class="spacer"></span><button type="button" class="react-add" aria-label="Add a reaction" title="Add a reaction">{{icon "smile"}}</button><select class="owner" aria-label="Who does it" hidden></select><button type="button" class="del" aria-label="Delete card" title="Delete card">×</button></div></article></template>
{{end}}
