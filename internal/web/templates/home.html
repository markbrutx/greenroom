{{define "main"}}
<section class="hero">
<p class="eyebrow">{{.Brand.Name}}</p>
<h1>Hi, {{.User}}.</h1>
<p class="lead">Small tools your team runs together, live.</p>
</section>
<ul class="tiles" role="list">
{{range .Data}}<li><a class="tile" href="/{{.Slug}}">
<span class="tile-icon">{{icon .Icon}}</span>
<span class="tile-body"><span class="tile-name">{{.Name}}</span><span class="tile-sum">{{.Summary}}</span>{{with .BadgeText}}<span class="tile-badge">{{.}}</span>{{end}}</span>
<span class="tile-go" aria-hidden="true">{{icon "arrow"}}</span>
</a></li>{{end}}
</ul>
{{end}}
