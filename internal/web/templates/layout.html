{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · {{.Brand.Name}}</title>
<script src="{{asset "theme.js"}}"></script>
<link rel="icon" href="/brand/logo?v={{.Brand.Version}}">
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="stylesheet" href="/brand.css?v={{.Brand.Version}}">
{{block "head" .}}{{end}}
</head>
<body class="{{block "bodyclass" .}}{{end}}">
<header class="topbar">
<a class="brand" href="/">{{if .Brand.Mark}}{{.Brand.Mark}}{{else}}<img src="/brand/logo?v={{.Brand.Version}}" alt="" width="28" height="28">{{end}}<span>{{.Brand.Name}}</span></a>
{{block "crumbs" .}}{{end}}
<span class="spacer"></span>
{{block "bar" .}}{{end}}
<button class="icon-btn theme-toggle" id="theme" type="button" aria-label="Switch theme">{{icon "moon"}}{{icon "sun"}}</button>
</header>
<main class="wrap" id="main">{{block "main" .}}{{end}}</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>{{end}}
