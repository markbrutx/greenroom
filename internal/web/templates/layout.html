{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · {{.Brand.Name}}</title>
<link rel="icon" href="/brand/logo?v={{.Brand.Version}}">
<link rel="preload" href="{{asset "fonts/nunito-latin.woff2"}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="stylesheet" href="/brand.css?v={{.Brand.Version}}">
{{block "head" .}}{{end}}
</head>
<body class="{{block "bodyclass" .}}{{end}}">
<header class="topbar">
<a class="brand" href="/"><img src="/brand/logo?v={{.Brand.Version}}" alt="" width="28" height="28"><span class="wordmark">{{.Brand.Wordmark}}</span></a>
{{block "crumbs" .}}{{end}}
<span class="spacer"></span>
{{block "bar" .}}{{end}}
</header>
<main class="wrap" id="main">{{block "main" .}}{{end}}</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>{{end}}
