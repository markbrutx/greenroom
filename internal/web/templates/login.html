{{define "bodyclass"}}page-login{{end}}
{{define "main"}}
<form class="login" method="post" action="/login">
<img class="login-logo" src="/brand/logo?v={{.Brand.Version}}" alt="{{.Brand.Name}}" width="64" height="64">
<input type="hidden" name="next" value="{{.Data.Next}}">
<input class="input" name="name" placeholder="Your name" aria-label="Your name" autocomplete="username" autocapitalize="words" maxlength="40" value="{{.Data.Name}}" {{if not .Data.Name}}autofocus {{end}}required>
<input class="input" type="password" name="password" placeholder="Team password" aria-label="Team password" autocomplete="current-password" {{if .Data.Name}}autofocus {{end}}required>
<button class="btn btn-primary" type="submit">Enter</button>
{{with .Data.Err}}<p class="form-error" role="alert">{{.}}</p>{{end}}
</form>
{{end}}
